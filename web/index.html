<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>🎓 College AI Assistant</h1>
                <p>Your intelligent academic companion</p>
            </div>

            <div class="status">
                <span></span>
                Online
            </div>
        </header>


        <main class="chat-container">

            <div id="chatMessages" class="chat-messages">

                <div class="message assistant">
                    <div class="avatar">AI</div>

                    <div class="bubble">
                        Hello! 👋 I'm your College AI Assistant.
                        <br><br>
                        You can ask me about students, marks,
                        attendance, and academic performance.
                    </div>
                </div>

            </div>


            <div class="suggestions">

                <button id="marksBtn">
                    📊 Abhishek's marks
                </button>

                <button id="attendanceBtn">
                    📅 Abhishek's attendance
                </button>

                <button id="lowAttendanceBtn">
                    ⚠️ Low attendance
                </button>

            </div>


            <div class="input-area">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask about students, marks, attendance..."
                    autocomplete="off"
                >

                <button id="sendButton">
                    ➤
                </button>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
